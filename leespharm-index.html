<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>李氏大药厂控股有限公司 — 官网改版演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600&family=Noto+Serif+SC:wght@500;600&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0a1b33;
    --slate:#64748b;
    --blue:#319AFF;
    --blue-2:#60B1FF;
    --line:rgba(15,23,42,.08);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Noto Sans SC','Inter',system-ui,sans-serif;
    background:#f9fafb;color:var(--ink);
    -webkit-font-smoothing:antialiased;line-height:1.6;
    overflow-x:hidden;
  }

  /* ===== Top Navbar ===== */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 28px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(20px) saturate(180%);
    border-bottom:1px solid var(--line);
    animation:fadeDown .7s ease both;
  }
  .brand-logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;letter-spacing:.5px}
  .brand-logo .star{
    width:30px;height:30px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--blue-2),var(--blue));
    color:#fff;font-size:14px;box-shadow:0 6px 16px rgba(49,154,255,.35);
  }
  .nav-links{display:flex;gap:30px}
  .nav-links a{
    color:var(--slate);text-decoration:none;font-size:14px;font-weight:500;
    position:relative;transition:color .25s;
  }
  .nav-links a:hover{color:var(--ink)}
  .nav-links a::after{
    content:'';position:absolute;left:0;bottom:-6px;height:2px;width:0;
    background:var(--blue);transition:width .25s;
  }
  .nav-links a:hover::after{width:100%}
  .nav-right{display:flex;align-items:center;gap:14px}
  .lang-toggle{
    border:1px solid var(--line);background:#fff;border-radius:20px;
    padding:6px 14px;font-size:13px;color:var(--slate);cursor:pointer;
  }
  .btn-dark{
    background:var(--ink);color:#fff;border:none;border-radius:24px;
    padding:9px 20px;font-size:13px;font-weight:500;cursor:pointer;
    transition:transform .2s, box-shadow .2s;
  }
  .btn-dark:hover{transform:translateY(-1px);box-shadow:0 10px 26px rgba(10,27,51,.25)}

  /* ===== Hero ===== */
  .hero{
    position:relative;width:100%;max-width:1400px;margin:30px auto;
    border-radius:48px;background:#fff;border:1px solid rgba(15,23,42,.06);
    box-shadow:0 40px 100px -20px rgba(0,0,0,.04);
    overflow:hidden;min-height:600px;display:flex;flex-direction:column;
  }
  .hero-video-wrap{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none;select:none}
  .hero-video-wrap video{width:100%;height:100%;object-fit:cover;transform:scale(1.05);transition:transform 1s}
  .hero-video-wrap::after{
    content:'';position:absolute;inset:0;
    background:linear-gradient(120deg,rgba(249,250,251,.92),rgba(249,250,251,.62) 45%,rgba(249,250,251,.3));
  }
  .hero-content{
    position:relative;z-index:20;flex:1;
    padding:64px 40px 40px;display:flex;flex-direction:column;align-items:flex-start;
    animation:fadeUp .9s .15s ease both;
  }
  .hero h1{
    font-family:'Noto Serif SC','Outfit',serif;font-weight:600;
    font-size:clamp(34px,5vw,54px);line-height:1.32;letter-spacing:0;
    color:var(--ink);max-width:760px;margin-bottom:22px;
  }
  .hero .sub{
    font-size:clamp(13px,1.6vw,15px);color:var(--slate);max-width:620px;
    line-height:1.95;font-weight:400;
  }
  .hero .sub b{color:var(--ink);font-weight:500}
  .hero-cta{
    margin-top:34px;background:var(--ink);color:#fff;border:none;
    border-radius:30px;padding:14px 34px;font-size:15px;cursor:pointer;
    transition:transform .2s, box-shadow .2s;
  }
  .hero-cta:hover{transform:scale(1.02);box-shadow:0 12px 34px rgba(10,27,51,.28)}

  /* ===== Floating pill nav ===== */
  .pill{
    position:absolute;bottom:34px;left:50%;transform:translateX(-50%);z-index:30;
    display:flex;align-items:center;gap:6px;
    background:rgba(255,255,255,.9);backdrop-filter:blur(24px);
    padding:7px 8px;border-radius:40px;
    box-shadow:0 12px 40px rgba(0,0,0,.08);border:1px solid rgba(15,23,42,.05);
    animation:fadeUp .9s .5s ease both;
  }
  .pill .logo{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid #f1f5f9;
    display:flex;align-items:center;justify-content:center;color:var(--blue);font-size:15px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
  .pill a{color:#94a3b8;text-decoration:none;font-size:12px;font-weight:600;padding:8px 14px;border-radius:20px;transition:color .2s}
  .pill a:hover{color:var(--ink)}
  .pill .touch{display:flex;align-items:center;gap:5px;background:#fff;border:1px solid rgba(15,23,42,.06);
    padding:8px 18px;border-radius:24px;font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;transition:border-color .2s}
  .pill .touch:hover{border-color:#cbd5e1}

  /* ===== Marquee ===== */
  .marquee-section{max-width:1400px;margin:10px auto 60px;padding:0 20px}
  .marquee{
    position:relative;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  }
  .track{display:flex;gap:18px;width:max-content;animation:scroll 32s linear infinite}
  .marquee:hover .track{animation-play-state:paused}
  .card{
    group:relative;height:96px;width:180px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;border-radius:48px;
    background:#fff;border:1px solid rgba(15,23,42,.07);box-shadow:0 2px 10px rgba(0,0,0,.04);
    cursor:pointer;transition:border-color .25s, transform .25s;position:relative;overflow:hidden;
    font-weight:600;font-size:15px;color:var(--ink);
  }
  .card:hover{border-color:#cbd5e1;transform:translateY(-2px)}
  .card .glow{
    position:absolute;inset:0;opacity:0;transform:scale(1.5);transition:opacity .3s, transform .3s;
    border-radius:48px;
  }
  .card:hover .glow{opacity:1;transform:scale(1)}
  .card span{position:relative;z-index:2}
  .card .hint{
    position:absolute;bottom:8px;right:14px;z-index:2;font-size:11px;font-weight:500;
    color:#fff;opacity:0;transition:opacity .25s;
  }
  .card:hover .hint{opacity:1}

  /* ===== Brand detail ===== */
  .detail{
    max-width:1400px;margin:0 auto 70px;padding:34px 40px;border-radius:32px;
    background:#fff;border:1px solid rgba(15,23,42,.06);box-shadow:0 30px 80px -30px rgba(0,0,0,.06);
    display:none;
  }
  .detail.show{display:block;animation:fadeUp .5s ease both}
  .detail h2{font-family:'Noto Serif SC',serif;font-size:26px;margin-bottom:10px}
  .detail .tag{display:inline-block;font-size:12px;color:#fff;background:var(--blue);
    padding:3px 12px;border-radius:20px;margin-bottom:14px}
  .detail p{color:var(--slate);font-size:15px;line-height:1.9;max-width:760px}
  .detail .back{margin-top:18px;background:none;border:1px solid var(--line);border-radius:24px;
    padding:8px 18px;font-size:13px;color:var(--ink);cursor:pointer}
  .detail .back:hover{border-color:var(--blue);color:var(--blue)}

  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:translateY(0)}}

  @media(max-width:720px){
    .nav-links{display:none}
    .hero{padding:0;margin:14px;border-radius:32px;min-height:520px}
    .hero-content{padding:48px 24px 32px}
    .card{width:150px;height:84px}
  }
</style>
</head>
<body>

  <!-- Top Navbar -->
  <header class="topbar">
    <div class="brand-logo"><span class="star">✦</span>李氏大药厂</div>
    <nav class="nav-links">
      <a href="#hero">关于我们</a>
      <a href="#hero">业务领域</a>
      <a href="#news">新闻资讯</a>
      <a href="#hero">联系我们</a>
    </nav>
    <div class="nav-right">
      <button class="lang-toggle">中 / EN</button>
      <button class="btn-dark">联系我们</button>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="hero-video-wrap">
      <video autoplay loop muted playsinline
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260505_101331_74f9b798-3f00-4e86-8a01-377aa16ffeaa.mp4">
      </video>
    </div>
    <div class="hero-content">
      <h1>科学，我们的信仰与追求</h1>
      <p class="sub">
        李氏大药厂控股有限公司 — 香港联交所主板上市生物医药集团（股份代号：<b>00950</b>）。<br>
        三十余年专注<b>心脑血管</b>、<b>眼科</b>与<b>肿瘤</b>领域的创新药研发与全球化布局，<br>
        持续以科学驱动人类健康。
      </p>
      <button class="hero-cta">联系我们</button>
    </div>
    <div class="pill">
      <span class="logo">✦</span>
      <a>关于我们</a>
      <a>业务领域</a>
      <a>新闻资讯</a>
      <span class="touch">Get in touch ›</span>
    </div>
  </section>

  <!-- Marquee -->
  <section class="marquee-section" id="news">
    <div class="marquee">
      <div class="track" id="track"></div>
    </div>
  </section>

  <!-- Brand detail -->
  <section class="detail" id="detail">
    <span class="tag" id="detail-tag">品牌</span>
    <h2 id="detail-title">标题</h2>
    <p id="detail-body">内容</p>
    <button class="back" onclick="closeDetail()">← 返回首页</button>
  </section>

<script>
  const brands = [
    {name:'李氏大药厂',color:'linear-gradient(135deg,#319AFF,#60B1FF)',tag:'集团',
     body:'李氏大药厂控股有限公司（股份代号：00950）成立于1994年，总部位于香港科学园，是一家在香港联交所主板上市的生物医药集团，专注创新药研发与全球化布局。'},
    {name:'兆科药业',color:'linear-gradient(135deg,#3b82f6,#2563eb)',tag:'子公司',
     body:'兆科药业（合肥）有限公司为李氏大药厂全资附属公司，坐落于安徽合肥，承担集团多个创新药的生产与转化基地职能。'},
    {name:'兆科眼科',color:'linear-gradient(135deg,#8b5cf6,#a855f7)',tag:'子公司',
     body:'兆科眼科专注眼科药物研发与商业化，是集团在眼科治疗领域的重要布局，覆盖干眼症、青光眼等多个适应症。'},
    {name:'合肥生产基地',color:'linear-gradient(135deg,#10b981,#059669)',tag:'基地',
     body:'位于安徽合肥的 GMP 生产基地，支撑集团心脑血管、眼科等核心管线的规模化生产。'},
    {name:'南沙生产基地',color:'linear-gradient(135deg,#0ea5e9,#0284c7)',tag:'基地',
     body:'位于广州南沙的现代化生产基地，进一步完善集团在大湾区的研发与制造布局。'},
    {name:'香港总部',color:'linear-gradient(135deg,#f59e0b,#d97706)',tag:'总部',
     body:'集团总部设于香港科学园，统筹全球研发战略、资本运作与海外业务拓展。'},
    {name:'心脑血管',color:'linear-gradient(135deg,#ef4444,#dc2626)',tag:'治疗领域',
     body:'心脑血管是集团核心治疗领域之一，拥有多款已上市与创新在研产品，覆盖预防、治疗与管理全周期。'},
    {name:'眼科 · 肿瘤',color:'linear-gradient(135deg,#ec4899,#db2777)',tag:'治疗领域',
     body:'眼科与肿瘤是集团重点投入的创新方向，依托兆科眼科及多款在研管线持续拓展临床价值。'},
  ];

  const track = document.getElementById('track');
  const makeCard = (b)=>{
    const el = document.createElement('div');
    el.className = 'card';
    el.innerHTML = `<div class="glow" style="background:${b.color}"></div><span>${b.name}</span><div class="hint">查看 ›</div>`;
    el.onclick = ()=>openDetail(b);
    return el;
  };
  // duplicate for seamless loop
  [...brands, ...brands].forEach(b=>track.appendChild(makeCard(b)));

  function openDetail(b){
    document.getElementById('detail-tag').textContent = b.tag;
    document.getElementById('detail-title').textContent = b.name;
    document.getElementById('detail-body').textContent = b.body;
    const d = document.getElementById('detail');
    d.classList.add('show');
    d.scrollIntoView({behavior:'smooth', block:'center'});
  }
  function closeDetail(){
    document.getElementById('detail').classList.remove('show');
    window.scrollTo({top:0, behavior:'smooth'});
  }
</script>
</body>
</html>
